<script>
(()=>{const root=document.currentScript.closest('.academy-hub');if(!root||root.dataset.ready)return;root.dataset.ready='1';const DB={"topics":[{"name":"物理：力・電流・運動","summary":"力のつり合い、電流・電圧・抵抗、仕事、速さを図と数量で考える。","remember":"公式は単位とセットで覚え、求めたい量の式に直す。","condition":"直列・並列回路、電流・電圧の関係や単位を混同しない。"},{"name":"化学：物質・化学変化","summary":"物質の性質、状態変化、化学反応、質量保存を粒子モデルで理解する。","remember":"実験前後の質量・気体・色などを表にまとめる。","condition":"化学変化では原子の種類と数が保存される。"},{"name":"生物：生命・遺伝","summary":"細胞、光合成、呼吸、消化・吸収、遺伝、生態系を理解する。","remember":"器官名と働きを組にし、対照実験の条件を確認する。","condition":"光合成実験では光・二酸化炭素・葉緑体などの条件を分ける。"},{"name":"地学：天気・地層・天体","summary":"気圧・前線・湿度、地層、地震、月や惑星を図で考える。","remember":"天気図は気圧配置・前線・風向をまとめて見る。","condition":"天体は観測時刻・方位・視点の条件を確認する。"},{"name":"実験・観察","summary":"目的、仮説、変える条件、そろえる条件、結果、考察を区別する。","remember":"調べたい条件以外をそろえ、結果を表にまとめる。","condition":"一度に複数条件を変えると原因を特定しにくい。"},{"name":"計算・グラフ","summary":"単位変換、比例、グラフの傾き、平均を使って結果を読む。","remember":"単位をそろえ、軸名と目盛りを見てから計算する。","condition":"グラフの軸や比例関係を読み違えない。"}],"questions":[{"topic":"物理：力・電流・運動","q":"電圧6V、抵抗3Ωのとき電流は？","options":["0.5A","2A","3A","18A"],"a":1,"ex":"オームの法則 I=V/R より6÷3=2A。"},{"topic":"物理：力・電流・運動","q":"速さを求める式は？","options":["時間÷距離","距離÷時間","距離×時間","質量÷体積"],"a":1,"ex":"速さ＝移動距離÷時間。"},{"topic":"化学：物質・化学変化","q":"化学変化の前後で保存されるものは？","options":["原子の種類と数","物質の色","状態","温度"],"a":0,"ex":"化学変化では原子の種類と数は保存される。"},{"topic":"生物：生命・遺伝","q":"光合成の材料の組み合わせは？","options":["酸素とでんぷん","二酸化炭素と水","窒素と食塩","水素と砂糖"],"a":1,"ex":"光合成では二酸化炭素と水などを材料に有機物をつくる。"},{"topic":"地学：天気・地層・天体","q":"低気圧の中心付近で起こりやすいのは？","options":["下降気流だけ","上昇気流","必ず無風","最も高い気圧"],"a":1,"ex":"地表付近で空気が集まり、上昇しやすい。"},{"topic":"実験・観察","q":"対照実験の主な目的は？","options":["時間を長くする","調べたい条件の影響を確かめる","結果を必ず同じにする","観察を省く"],"a":1,"ex":"調べたい条件以外をそろえ、影響を比較する。"},{"topic":"計算・グラフ","q":"グラフを読む前に確認するものは？","options":["軸名・単位・目盛り","線の色だけ","紙の大きさ","凡例の順番だけ"],"a":0,"ex":"軸名や単位を見落とすと数値を誤読する。"},{"topic":"物理：力・電流・運動","q":"【入試実戦】抵抗一定で電圧を2倍にすると電流は？","options":["半分","2倍","4倍","変わらない"],"a":1,"ex":"オームの法則より、抵抗一定なら電流は電圧に比例。"}]},key='pass-academy-pass-juken-academy2026/junior-science';let state={learned:[],review:[],answered:0,correct:0,stats:{}};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}let mock=[],mi=0,ma=0,mc=0;const $=(s,base=root)=>base.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}stats()}function stats(){$('[data-stat="learned"]').textContent=state.learned.length;$('[data-stat="accuracy"]').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'—';$('[data-stat="review"]').textContent=state.review.length;$('[data-stat="weak"]').textContent=Object.values(state.stats).filter(x=>x.total>=2&&x.correct/x.total<.7).length}function topic(){return DB.topics.find(t=>t.name===$('[data-topic]').value)||DB.topics[0]}function qs(){return DB.questions.filter(q=>q.topic===$('[data-topic]').value)}function cards(){let s=$('[data-search]').value.toLowerCase();$('[data-cards]').innerHTML=DB.topics.filter(t=>(t.name+t.summary).toLowerCase().includes(s)).map(t=>'<article class="card"><span class="tag">'+esc(t.name)+'</span><p>'+esc(t.summary)+'</p><button data-pick="'+esc(t.name)+'">この分野を学ぶ</button></article>').join('')||'<p>該当する分野がありません。</p>';$$('[data-pick]').forEach(b=>b.onclick=()=>{$('[data-topic]').value=b.dataset.pick;lesson();tab(1)})}function lesson(){let t=topic();$('[data-lesson]').innerHTML='<span class="tag">'+esc(t.name)+'</span><h3>要点・基礎知識</h3><p>'+esc(t.summary)+'</p><h3>覚え方・整理方法</h3><p>'+esc(t.remember)+'</p><h3>使う条件・注意点</h3><p>'+esc(t.condition)+'</p><button data-mark>この分野を学習済みにする ✓</button>'; $('[data-mark]').onclick=()=>{if(!state.learned.includes(t.name))state.learned.push(t.name);save();cards()};$('[data-tips]').innerHTML='<h3>解き方のコツ</h3><p>'+esc(t.remember)+'</p><h3>よくあるミス・条件</h3><p>'+esc(t.condition)+'</p><p>問題文の条件・単位・根拠を確認し、答えが条件に合うか見直しましょう。</p>'}function record(q,ok){state.answered++;if(ok)state.correct++;state.stats[q.topic]??={correct:0,total:0};state.stats[q.topic].total++;if(ok)state.stats[q.topic].correct++;if(!ok&&!state.review.includes(q.q))state.review.push(q.q);if(ok)state.review=state.review.filter(x=>x!==q.q);save()}function ask(box,q,next,label){let chosen=null,done=false;box.innerHTML='<span class="tag">'+esc(q.topic)+'</span><p class="muted">'+esc(label||'理解度チェック')+'</p><h3>'+esc(q.q)+'</h3><div class="choices"></div><div class="answer" data-fb>選択肢を選んで答え合わせしよう。</div>';const c=$('.choices',box);q.options.forEach((v,i)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>{if(done)return;chosen=i;$$('.choices button').forEach(x=>x.style.outline='');b.style.outline='2px solid #6ed8ff'};c.appendChild(b)});let b=document.createElement('button');b.className='primary';b.textContent='解答・解説を見る';b.onclick=()=>{if(done||chosen===null)return;done=true;let ok=chosen===q.a;record(q,ok);if(label&&label.startsWith('模擬テスト')&&ok)mc++;$('.choices button')[q.a].style.borderColor='#5ee0b5';if(!ok)$$('.choices button')[chosen].style.borderColor='#ff8794';$('[data-fb]',box).innerHTML='<b>'+(ok?'正解！':'不正解')+'</b><p>正解：'+esc(q.options[q.a])+'</p><p>'+esc(q.ex)+'</p>';b.disabled=true;let n=document.createElement('button');n.textContent='次へ';n.onclick=next;box.appendChild(n)};box.appendChild(b)}function tab(i){$$('[data-tab]').forEach(b=>b.classList.toggle('active',+b.dataset.tab===i));$$('[data-panel]').forEach(p=>p.classList.toggle('active',+p.dataset.panel===i));if(i===1)lesson();if(i===2)lesson();if(i===3)quick();if(i===4)app();if(i===5)data();if(i===6)weak();if(i===7)exam();if(i===8)reviews()}function quick(){let a=qs();if(!a.length){$('[data-quick]').textContent='この分野の問題は準備中です。';return}ask($('[data-quick]'),a[0],()=>ask($('[data-quick]'),a[(a.indexOf(a[0])+1)%a.length],quick,'基本問題'),'基本問題')}function app(){let q=DB.questions.find(q=>/【入試実戦】|【共テ風】/.test(q.q))||DB.questions[DB.questions.length-1];ask($('[data-app]'),q,app,'応用・入試実戦')}function data(){let q=DB.questions.find(q=>/資料|グラフ|統計|相関|条件|実験/.test(q.q))||DB.questions[0];ask($('[data-data]'),q,data,'資料・条件読解')}function exam(){let q=DB.questions.find(q=>/【入試実戦】|【共テ風】/.test(q.q))||DB.questions[0];ask($('[data-exam]'),q,exam,'入試・共テ型')}function weak(){let a=Object.entries(state.stats);$('[data-weaklist]').innerHTML=a.length?a.map(([k,v])=>{let p=Math.round(v.correct/v.total*100);return '<div class="card"><b>'+esc(k)+'</b> '+v.correct+'/'+v.total+'問（'+p+'%）<div class="progress"><span style="width:'+p+'%;background:'+(p<60?'#ff8794':p<80?'#ffd27a':'#5ee0b5')+'"></span></div></div>'}).join(''):'<p>まだ記録がありません。演習すると弱点を分析できます。</p>'}function start(){mock=[...DB.questions].sort(()=>Math.random()-.5).slice(0,Math.min(10,DB.questions.length));mi=0;ma=0;mc=0;nextMock()}function nextMock(){if(mi>=mock.length){$('[data-mock]').innerHTML='<h3>模擬テスト終了</h3><p>今回の正答率：'+Math.round(mc/Math.max(1,ma)*100)+'%（'+mc+'/'+ma+'）</p><button data-weaknow>分野別の弱点を見る</button>'; $('[data-weaknow]').onclick=weak;weak();return}let q=mock[mi];ask($('[data-mock]'),q,()=>{ma++;mi++;nextMock()},'模擬テスト '+(mi+1)+'/'+mock.length)}function reviews(){$('[data-reviews]').innerHTML=state.review.length?state.review.map(q=>{let item=DB.questions.find(x=>x.q===q);return '<article class="card"><p>'+esc(q)+'</p>'+(item?'<button data-rq="'+esc(q)+'">もう一度解く</button>':'')+'<button data-rm="'+esc(q)+'">リストから外す</button></article>'}).join(''):'<p>復習リストは空です。問題を間違えると自動で追加されます。</p>';$$('[data-rq]').forEach(b=>b.onclick=()=>{let q=DB.questions.find(x=>x.q===b.dataset.rq);if(q)ask($('[data-reviews]'),q,reviews,'復習問題')});$$('[data-rm]').forEach(b=>b.onclick=()=>{state.review=state.review.filter(x=>x!==b.dataset.rm);save();reviews()})}$$('[data-tab]').forEach(b=>b.onclick=()=>tab(+b.dataset.tab));$('[data-topic]').onchange=()=>{lesson();quick()};$('[data-search]').oninput=cards;$('[data-start]').onclick=start;$$('[data-weak]').forEach(b=>b.onclick=weak);$('[data-export]').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='study-record.json';a.click();URL.revokeObjectURL(u)};$('[data-reset]').onclick=()=>{if(confirm('学習記録をリセットしますか？')){state={learned:[],review:[],answered:0,correct:0,stats:{}};save();reviews();cards()}};cards();lesson();quick();weak();reviews();stats()})();

<style id="mobile-tap-guard">html,body{touch-action:pan-y}button,a,[role="button"],[data-tab],[data-mode],[data-start],[data-weak],[data-export]{pointer-events:auto!important;touch-action:manipulation;position:relative}button:disabled{pointer-events:none}</style>
<script id="mobile-tap-guard-script">
(()=>{document.addEventListener('click',function(e){const b=e.target&&e.target.closest&&e.target.closest('button,[role="button"],[data-tab],[data-mode],[data-start],[data-weak],[data-export]');if(!b)return;const root=b.closest('.academy-hub,#unified-study-cards');if(!root)return; if(b.dataset.tab!==undefined){const i=Number(b.dataset.tab);root.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));const panels=root.querySelectorAll('[data-panel]');panels.forEach((p,n)=>p.classList.toggle('active',n===i));const legacy=root.querySelectorAll('.panel');if(!panels.length&&legacy.length)legacy.forEach((p,n)=>p.classList.toggle('active',n===i));}},{capture:true});document.addEventListener('touchend',function(e){const b=e.target&&e.target.closest&&e.target.closest('button');if(!b||b.disabled)return;const root=b.closest('.academy-hub,#unified-study-cards');if(!root)return;if(b.dataset.tab!==undefined){e.preventDefault();b.click()}},{passive:false,capture:true});})();
</script>
